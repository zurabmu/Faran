stages:
  - verify
  - publish
  - build
  - pages
  - mirror
  - triggers

include:
  - project: "zurabm/ci-templates"
    ref: v1.8.0
    file:
      - "/python/verify.yml"
      - "/python/publish.yml"

variables:
  RUN_INTEGRATION_TESTS: "true"
  RUN_BENCHMARKS: "true"
  COLLECT_COVERAGE: "true"
  PYPI_PROJECT_NAME: "faran"
  COVERAGE_SOURCE: "faran"
  PYRIGHT_PYTHON_NODE_VERSION: "24.22.3"

nox:test_without_jax:
  extends: .nox
  script:
    - uv run nox -s test_without_jax

nox:test_full:
  extends: .nox
  script:
    - uv run nox -s test_full

benchmark:
  extends: .benchmark-base
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip benchmark\]/'
      when: never
    - if: '$RUN_VERIFY == "true" && $RUN_BENCHMARKS == "true"'
  script:
    - curl --proto '=https' --tlsv1.2 -sSfL https://bencher.dev/download/install-cli.sh | bash
    - source $HOME/.cargo/env
    - bencher --version
    - echo "BENCHER_API_TOKEN is set? ${BENCHER_API_TOKEN:+yes}"
    - uv run pytest -m 'benchmark and not risk_benchmark' --benchmark-json=benchmark.json
    - >-
      bencher run
      --project faran
      --token "$BENCHER_API_TOKEN"
      --branch "$CI_COMMIT_REF_NAME"
      --testbed gitlab-ci
      --adapter python_pytest
      --file benchmark.json

coverage:
  extends:
    - .coverage-report-base
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip coverage\]/'
      when: never
    - if: '$RUN_VERIFY == "true" && $COLLECT_COVERAGE == "true"'
  script:
    - |
      COVERAGE_FILES=""
      [ -f coverage-unit.xml ] && COVERAGE_FILES="$COVERAGE_FILES --file coverage-unit.xml"
      [ -f coverage-integration.xml ] && COVERAGE_FILES="$COVERAGE_FILES --file coverage-integration.xml"
      
      if [ -z "$COVERAGE_FILES" ]; then
        echo "ERROR - No coverage files found" && exit 1
      fi
      
      curl -Os https://cli.codecov.io/latest/linux/codecov
      chmod +x codecov
      ./codecov upload-process $COVERAGE_FILES --token $CODECOV_TOKEN

build-docs-ui:
  stage: build
  image: node:22
  needs: []
  script:
    - npm install -g pnpm
    - (cd visualizer/engine && pnpm install --frozen-lockfile && pnpm build)
    - (cd docs/ui && pnpm install --frozen-lockfile && pnpm build)
  artifacts:
    paths:
      - visualizer/faran_visualizer/renderers/canvas/engine.js
      - docs/content/javascripts/ui/
      - docs/content/assets/logo.svg
      - docs/content/assets/logo-mark.svg
      - docs/content/assets/favicon.svg
      - docs/content/assets/favicon.ico
      - docs/content/assets/apple-touch-icon.png
      - docs/content/assets/katex/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: pages
  extends:
    - .base
  script:
    - uv run pytest -v -m docs --visualize --notebooks
    - uv run python -m docs.scripts.wheel
    - uv run zensical build --clean --strict
    - mv site public
  artifacts:
    paths:
      - public
      - notebooks
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build-docs-ui
      artifacts: true

mirror-github:
  stage: mirror
  image:
    name: alpine/git:latest
    entrypoint: [""]
  needs:
    - job: pages
      artifacts: true
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git add -f notebooks/
    - echo "python-3.13" > runtime.txt
    - echo "faran" >> requirements.txt
    - echo "faran_visualizer[notebook]" >> requirements.txt
    - echo "tqdm" >> requirements.txt
    - git add runtime.txt requirements.txt
    - "git diff --cached --quiet || git commit -m 'chore: update generated notebooks [skip ci]'"
    - git remote add github "https://oauth2:${GITHUB_PAT}@${GITHUB_HOST}"
    - git push github HEAD:main --force
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

visualizer:
  stage: triggers
  trigger:
    include: visualizer/.gitlab-ci.yml
  inherit:
    variables: false
  rules:
    - changes:
        - "visualizer/**/*"
      when: always
  variables:
    PYPI_API_TOKEN: $PYPI_API_TOKEN_VISUALIZER
